name: Windows x64 - Build and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.iss'
      - '**/*.cmd'
      - '.github/workflows/windows-x64-installer.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Verify single solution compiles
        shell: pwsh
        run: dotnet build SourceCodeEditor.sln -c Release -p:Platform=x64
      - name: Publish Windows x64 application
        shell: pwsh
        run: dotnet publish SourceCodeEditor.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - name: Verify CMD is attached to embedded ConPTY (no external console)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-x64/SourceCodeEditor.exe'
          $report = Join-Path $env:RUNNER_TEMP 'sourcecodeeditor-conpty-test.txt'
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test-conpty `"$report`"" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Embedded ConPTY self-test failed (exit $($process.ExitCode))" }
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SourceCodeEditor-Windows-x64
          path: |
            dist/SourceCodeEditor-Setup-x64.exe
            dist/win-x64/*
